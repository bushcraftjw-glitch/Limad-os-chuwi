name: Build LiMaD OS BASE1 ISO

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source commit expected by the local LiMaD build starter
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify dispatched commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Workflow checked out $ACTUAL_SHA but local starter requested $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "Verified build commit: $ACTUAL_SHA"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/boost /opt/hostedtoolcache || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso curl unzip rsync git cpio dconf-cli sassc libglib2.0-dev-bin libxml2-utils python3-yaml shellcheck dpkg-dev

      - name: Verify build dependencies
        run: |
          for command in cpio curl dconf dpkg-scanpackages git gh mount mountpoint python3 rsync sassc shellcheck umount unzip xorriso; do
            command -v "$command"
          done
          dconf help compile >/dev/null
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
      - name: Validate source
        run: |
          chmod +x START-RC1-GITHUB-BUILD-LINUX.sh tools/*.sh tools/*.py build/*.sh tests/*.sh tests/*.py build/rootfs/usr/local/bin/*
          python3 -B tests/test-shell-regressions.py
          python3 -B tests/test-version-consistency.py
          python3 -B tests/test-v23-liview.py
          python3 -B tests/test-v26-liview-performance.py
          python3 -B tests/test-v24-gaming.py
          python3 -B tests/test-v24-build-pipeline-safety.py
          python3 -B tests/test-v25-grubenvolk.py
          python3 -B tests/test-v25-target-preflight.py
          python3 -B tests/test-v26-updater-gtk4.py
          python3 -B tests/test-v26-heroic.py
          python3 -B tests/test-v38-anycubic-native.py
          shellcheck -e SC1091 START-RC1-GITHUB-BUILD-LINUX.sh tools/*.sh build/*.sh build/casper-bottom/* tests/*.sh build/rootfs/usr/local/bin/limad-base1-first-login build/rootfs/usr/local/bin/limad-first-login-setup build/rootfs/usr/local/bin/limad-runtime-deps build/rootfs/usr/local/bin/limad-sync-gtk4-theme build/rootfs/usr/local/bin/limad-design-system build/rootfs/usr/local/bin/limad-desktop-core-system build/rootfs/usr/local/bin/limad-link-health-check build/rootfs/usr/local/bin/limad-link-status-ensure build/rootfs/usr/local/bin/limad-lidrop-status-ensure build/rootfs/usr/local/bin/limad-required-user-apps build/rootfs/usr/local/bin/limad-zen-voltroute-bookmark build/rootfs/usr/local/bin/limad-titlebuttons-ensure build/rootfs/usr/local/bin/limusic build/rootfs/usr/local/bin/limad-liview-deps build/rootfs/usr/local/bin/limad-gaming-deps build/rootfs/usr/local/bin/limad-heroic-deps build/rootfs/usr/local/bin/limad-grubenvolk-deps build/rootfs/usr/local/bin/limad-anycubic-deps build/rootfs/usr/local/bin/limad-grubenvolk build/rootfs/usr/local/bin/liview build/rootfs/usr/bin/anycubicslicernext
          ./tools/reassemble-vendor.sh
          python3 -B tests/test-filter-install-sources.py
          python3 -B tests/test-update-md5.py
          python3 -B tests/test-brand-grub.py
          python3 -B tests/test-design-assets.py
          python3 -B tests/test-status-and-titlebuttons.py
          if command -v node >/dev/null 2>&1; then node --check build/rootfs/usr/share/gnome-shell/extensions/limad-menu@limad.local/extension.js; fi
          python3 -B tests/test-installer-branding.py
          python3 -B tests/test-imac17-firmware.py
          python3 -B tests/test-lilink-and-lidrop-scope.py
          python3 -B tests/test-v22-menu-lidrop.py
          python3 -B tests/test-v22-apps-titlebuttons.py
          ./tests/validate-source.sh

      - name: Build ISO
        run: ./build/build-iso.sh

      - name: Prepare release files
        run: |
          source config/build.env
          mkdir -p release
          cp "out/$OUTPUT_ISO_NAME.sha256" release/ISO-SHA256.txt
          split -b 1900M -d -a 2 "out/$OUTPUT_ISO_NAME" "release/$OUTPUT_ISO_NAME.part-"
          (cd release && sha256sum "$OUTPUT_ISO_NAME".part-* > ISO-PARTS-SHA256.txt)
          (cd release && sha256sum -c ISO-PARTS-SHA256.txt)
          cp out/BUILD-REPORT.txt release/BUILD-REPORT.txt
          rm -f "out/$OUTPUT_ISO_NAME"
          df -h
          ls -lh release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source config/build.env
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" release/* --title "LiMaD OS 3.0 RC1 BASE1" --notes-file out/BUILD-REPORT.txt
